---
- name: Test OpenShift API connectivity
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Query OpenShift API
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: default
      register: api_result

    - name: Confirm API access
      ansible.builtin.assert:
        that:
          - api_result.resources | length == 1
        fail_msg: "OpenShift API connectivity test failed"

    - name: Report success
      ansible.builtin.debug:
        msg: "OpenShift API authentication successful"
