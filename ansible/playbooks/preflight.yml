---
- name: Require an explicit management site
  ansible.builtin.assert:
    that:
      - target_site in ['alpha', 'omega']
    fail_msg: "Set target_site to alpha or omega in the AAP Job Template."

- name: Require the cluster API and Bitbucket runtime credentials
  ansible.builtin.assert:
    that:
      - ocp_api_host | length > 0
      - ocp_api_token | length > 0
      - ocp_api_ca_file | length > 0
      - bitbucket_username | length > 0
      - bitbucket_token | length > 0
    fail_msg: "Missing securely injected API/CA/Bitbucket runtime credentials."
  no_log: true

- name: Verify that the CA certificate file exists
  ansible.builtin.stat:
    path: "{{ ocp_api_ca_file }}"
  register: ocp_ca_stat

- name: Require a readable CA certificate file
  ansible.builtin.assert:
    that:
      - ocp_ca_stat.stat.exists | default(false)
      - ocp_ca_stat.stat.isreg | default(false)

- name: Confirm required repository manifests are present
  ansible.builtin.stat:
    path: "{{ repo_root }}/{{ item }}"
  loop:
    - gitops/bootstrap/projects/management.yaml
    - "gitops/bootstrap/root-{{ target_site }}.yaml"
    - "gitops/applicationsets/{{ target_site }}/kustomization.yaml"
  register: gitops_source_files

- name: Check required repository files
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing repository file: {{ item.item }}"
  loop: "{{ gitops_source_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify connection to the selected OpenShift cluster
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: default
  register: api_probe

- name: Confirm API query result
  ansible.builtin.assert:
    that:
      - api_probe.resources | length == 1
    fail_msg: "Cannot query the OpenShift API with the supplied token."
