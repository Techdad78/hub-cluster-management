---
- name: Create GitOps Operator namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitops_operator_namespace }}"

- name: Create GitOps OperatorGroup
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-gitops-operator
        namespace: "{{ gitops_operator_namespace }}"
      spec:
        upgradeStrategy: Default

- name: Create GitOps Operator Subscription
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: openshift-gitops-operator
        namespace: "{{ gitops_operator_namespace }}"
      spec:
        name: openshift-gitops-operator
        channel: "{{ gitops_operator_channel }}"
        installPlanApproval: "{{ gitops_install_plan_approval }}"
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for GitOps Subscription to resolve to a CSV
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ gitops_operator_namespace }}"
    name: openshift-gitops-operator
  register: gitops_subscription
  until:
    - gitops_subscription.resources | length == 1
    - gitops_subscription.resources[0].status.currentCSV | default('') | length > 0
  retries: 60
  delay: 10

- name: Wait for GitOps Operator CSV to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ gitops_operator_namespace }}"
    name: "{{ gitops_subscription.resources[0].status.currentCSV }}"
  register: gitops_csv
  until:
    - gitops_csv.resources | length == 1
    - gitops_csv.resources[0].status.phase | default('') == 'Succeeded'
  retries: 90
  delay: 10
